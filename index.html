function parseAnn(s){if(!s)return{role:'',ref:'',q:'',cs:''};const p=s.split(':');let f=p[0],role=f,ref='';const g=f.indexOf('>');if(g>=0){role=f.slice(0,g);ref=f.slice(g+1)}return{role:role.trim(),ref:ref.trim(),q:(p[1]||'').trim(),cs:(p[2]||'').trim().toUpperCase()}}
function splitP(t){const m=t.match(/^([«"„“(\-—–]*)(.*?)([.,!?;:…»"”)]*)$/);return m?{lead:m[1],core:m[2],trail:m[3]}:{lead:'',core:t,trail:''}}
function blankAnn(){return{role:'',parent:-1,q:'',cs:''}}
function buildBoard(src){
 const toks=tokenize(src).map(parseTok);const hasKey=toks.some(t=>t.ann!==null);const chips=[];
 for(let i=0;i<toks.length;i++){const t=toks[i],w=norm(t.text);
  if((w==='не'||w==='ни')&&t.ann===null&&i+1<toks.length&&norm(toks[i+1].text)){const n=toks[i+1],nw=norm(n.text);chips.push({pre:t.text,text:n.text,word:nw,ann:n.ann,func:FUNC.has(nw)});i++;continue}
  chips.push({pre:'',text:t.text,word:w,ann:t.ann,func:!w||FUNC.has(w)})}
 const key=chips.map(c=>{const a=parseAnn(c.ann);return{role:a.role,parent:-1,q:a.q,cs:a.cs,_ref:a.ref}});
 key.forEach((k,i)=>{if(k._ref)k.parent=findRef(chips,k._ref,i);delete k._ref});
 key.forEach(k=>{const rs=k.role.split('|');if(rs[0]==='об'&&rs.includes('д')){k.both=1;return}if(k.role!=='об'||!k.q)return;const pq=k.q.split('|').map(x=>x.trim()).find(x=>{const m=x.match(/^(\S+)\s+(.+)$/);return m&&PREFIXES.includes(m[1])});
  if(!pq)return;const base=pq.split(/\s+/).pop(),cs={'чём?':'П','ком?':'П','чем?':'Т','кем?':'Т','что?':'В','кого?':'В','чего?':'Р','чему?':'Д','кому?':'Д'}[base];if(!cs)return;k.role='об|д';k.cs=k.cs||cs;k.both=1});
 return{chips,key:hasKey?key:null};
}
function findRef(chips,ref,self){let[w,n]=ref.split('#');w=norm(w);n=+n||1;let c=0;for(let j=0;j<chips.length;j++){if(j!==self&&chips[j].word===w){c++;if(c===n)return j}}return -1}
function refOf(chips,p,self){const w=chips[p].word;let n=0;for(let j=0;j<=p;j++)if(j!==self&&chips[j].word===w)n++;return n>1?w+'#'+n:w}
function serialize(chips,A){
 return chips.map((c,i)=>{const a=A[i];let s=null;
  if(a&&(a.role||a.parent>=0)){s=a.role;if(a.parent>=0)s+='>'+refOf(chips,a.parent,i);if(a.q||a.cs)s+=':'+(a.q||'');if(a.cs)s+=':'+a.cs}
  const p=splitP(c.text);return (c.pre?c.pre+' ':'')+p.lead+p.core+(s!==null?'{'+s+'}':'')+p.trail}).join(' ');
}
const cut=(t,n)=>t.length>n?t.slice(0,n).trim()+'…':t;
function stripMarkup(src){return tokenize(src).map(t=>parseTok(t).text).join(' ')}
function splitSentences(src){const out=[];let cur='',d=0;const s=String(src).replace(/\s+/g,' ').trim();
 for(let i=0;i<s.length;i++){const ch=s[i];if(ch==='{')d++;if(ch==='}')d=Math.max(0,d-1);cur+=ch;
  if(d===0&&/[.!?…]/.test(ch)){let j=i+1;while(j<s.length&&/[.!?…»"”)]/.test(s[j])){cur+=s[j];j++}i=j-1;if(j>=s.length||s[j]===' '){if(cur.trim())out.push(cur.trim());cur=''}}}
 if(cur.trim())out.push(cur.trim());return out}
function qn(x){return String(x||'').toLowerCase().replace(/ё/g,'е').replace(/[?\s]/g,'')}
function qMatch(s,k){if(!k)return!!s;return k.split('|').some(a=>qn(a)===qn(s))}

 function tag(chips){

  <div class="chips" style="margin:.6rem 0">${['кто?','что?'].map(q=>`<button class="chip" data-sq="${q}" style="font-size:1.6rem;padding:.3rem 1.4rem">${q}</button>`).join('')}</div>
  <div class="mact"><button class="btn" id="sqNo">Без вопроса</button></div>`);
 box.style.minWidth='auto';
 $$('[data-sq]',box).forEach(b=>b.onclick=()=>{B.st[i].q=b.dataset.sq;closeModal();changed(B)});
 $('#sqNo',box).onclick=()=>{B.st[i].q='';closeModal();changed(B)}}
function toggleAcc(B,i){if(B.marks[i]!=='bad'&&!B.missSet.has(i))return;B.acc.has(i)?B.acc.delete(i):B.acc.add(i);refresh(B)}
function changed(B){B.marks={};B.checked=false;B.missSet=new Set();refresh(B);if(B.onChange)B.onChange()}
function setFb(B,html,cls){if(B.fbEl){B.fbEl.innerHTML=html;B.fbEl.className='fb '+(cls||'')}setPose(cls==='good'?'happy':cls==='badc'?'think':'point')}

/* ---- окно: вопрос / член предложения / падеж ---- */
function openLinkModal(B,c,p,isNew){
 const full=B.opt.mode==='full',cur=B.st[c];
 let q=isNew?'':cur.q,role=(['д','о','об'].includes(cur.role)&&!isNew)||cur.role==='с'?cur.role:'',cs=isNew?'':cur.cs;
 let pre='',base=q;{const m=q.match(/^(\S+)\s+(.+)$/);if(m&&PREFIXES.includes(m[1])){pre=m[1];base=m[2]}}
 const main=B.chips[p],dep=B.chips[c];
 const box=openModal(`<h3>${esc(splitP(main.text).core)} → ${esc(splitP(dep.text).core)}</h3>
  <h4>Какой вопрос задаём от главного слова к зависимому?</h4>
  <div class="chips" id="mPre"><button class="chip pr" data-v="">без предлога</button>${PREFIXES.map(x=>`<button class="chip pr" data-v="${x}">${x}</button>`).join('')}</div>
  <div style="height:.3rem"></div>
  ${full?`<div class="chips" style="margin-bottom:.35rem">${PREDQ.map(x=>`<button class="chip" data-b="${x}" style="background:#fef2f2">${x}</button>`).join('')}</div>`:''}
  ${BASEQ.map(g=>`<div class="chips" style="margin-bottom:.35rem">${[...new Set(g)].map(x=>`<button class="chip" data-b="${x}">${x}</button>`).join('')}</div>`).join('')}
  <div class="qprev" id="mQ"></div>
  ${full?`<h4>Какой это член предложения?</h4><div class="chips" id="mRole">${['с','д','о','об'].map(r=>`<button class="chip" data-r="${r}">${ROLES[r].name} ${lineIcon(r,'2.6em')}</button>`).join('')}</div>
  <div id="mCaseW" style="display:none"><h4>В каком падеже дополнение?</h4><div class="chips" id="mCase">${CASES.filter(x=>x[0]!=='И').map(x=>`<button class="chip" data-c="${x[0]}">${x[1]} <small>(${x[2]})</small></button>`).join('')}</div></div>`:''}
  <div class="mact">${!isNew?'<button class="btn red" id="mDel">🗑 Убрать стрелку</button>':''}<button class="btn" id="mCancel">Отмена</button><button class="btn ok" id="mOk">Готово ✓</button></div>`);
 const upd=()=>{q=base?(pre?pre+' ':'')+base:'';$$('#mPre .chip',box).forEach(b=>b.classList.toggle('on',b.dataset.v===pre));$$('[data-b]',box).forEach(b=>b.classList.toggle('on',b.dataset.b===base));
  $('#mQ',box).textContent=q?`${splitP(main.text).core} (${q}) ${splitP(dep.text).core}`:'Вопрос не выбран';
  if(full){$$('#mRole .chip',box).forEach(b=>b.classList.toggle('on',b.dataset.r===role));$('#mCaseW',box).style.display=role==='д'?'':'none';$$('#mCase .chip',box).forEach(b=>b.classList.toggle('on',b.dataset.c===cs))}
  $('#mOk',box).disabled=!q||(full&&(!role||(role==='д'&&!cs)))};
 $$('#mPre .chip',box).forEach(b=>b.onclick=()=>{pre=b.dataset.v;upd()});
 $$('[data-b]',box).forEach(b=>b.onclick=()=>{base=b.dataset.b;if(full&&PREDQ.includes(base)){role='с';pre=''}else if(full&&role==='с'&&!PREDQ.includes(base))role='';if((base==='ком?'||base==='чём?')&&!pre)pre='о';upd()});
 if(full){$$('#mRole .chip',box).forEach(b=>b.onclick=()=>{role=b.dataset.r;upd()});$$('#mCase .chip',box).forEach(b=>b.onclick=()=>{cs=b.dataset.c;upd()})}
 $('#mCancel',box).onclick=()=>{closeModal();refresh(B)};
 if($('#mDel',box))$('#mDel',box).onclick=()=>{B.st[c]=cur.role==='с'?{role:'с',parent:-1,q:'',cs:''}:blankAnn();closeModal();changed(B)};
 $('#mOk',box).onclick=()=>{B.st[c]={role:full?role:'',parent:p,q,cs:full&&role==='д'?cs:''};closeModal();setFb(B,'','');changed(B)};
 upd();
}

/* ---- проверка ---- */
const W=(B,i)=>'«'+splitP(B.chips[i].text).core+'»';
function checkBoard(B){const m=B.opt.mode,K=B.key,A=B.st,marks={},errs=[],notes=[],missSet=new Set();let good=0,bad=0;
 const alts=x=>x?x.split('|'):[];
 B.chips.forEach((c,i)=>{if(c.func)return;const k=K[i],s=A[i],kr=alts(k.role),opt=kr.includes(''),krn=kr.filter(Boolean);
  if(m==='basis'){const kb=krn.find(r=>r==='п'||r==='с')||'',sb=(s.role==='п'||s.role==='с')?s.role:'';
   if(!kb&&!sb)return;if(!sb){if(!opt)missSet.add(i);return}if(kr.includes(sb)){marks[i]='ok';good++}else{marks[i]='bad';bad++;errs.push(kb?`${W(B,i)} — это ${ROLES[kb].name.toLowerCase()}`:`${W(B,i)} — не входит в основу`)}return}
  if(m==='colloc'){const kH=k.parent>=0&&!kr.includes('п')&&!kr.includes('с'),sH=s.parent>=0;
   if(!sH){if(kH&&!opt)missSet.add(i);return}
   if(kH&&s.parent===k.parent&&qMatch(s.q,k.q)){marks[i]='ok';good++;return}
   marks[i]='bad';bad++;const kp=K[s.parent]?(K[s.parent].role||''):'';
   if(kH&&s.parent===k.parent)errs.push(`${W(B,s.parent)} → ${W(B,i)}: неверный вопрос`);
   else if(K[s.parent]&&K[s.parent].parent===i)errs.push(`${W(B,s.parent)} и ${W(B,i)}: стрелка идёт от главного слова к зависимому — поменяй направление`);
   else if((kr.includes('п')||kr.includes('с'))&&(kp.includes('п')||kp.includes('с')))errs.push(`${W(B,s.parent)} и ${W(B,i)} — это грамматическая основа, а не словосочетание`);
   else errs.push(`${W(B,s.parent)} → ${W(B,i)}: эти слова не связаны так`);return}
  // full
  const sM=s.role||s.parent>=0;
  if(!krn.length){if(sM){marks[i]='bad';bad++;errs.push(`${W(B,i)} — не нужно отмечать`)}return}
  if(!sM){if(!opt)missSet.add(i);return}
  let ok=kr.includes(s.role),why=ok?'':(s.role?`${W(B,i)} — не ${ROLES[s.role].name.toLowerCase()}`:`${W(B,i)}: подчеркни, какой это член предложения`);
  if(ok&&s.role==='с'&&s.parent>=0){const pr=(K[s.parent].role||'').split('|');if(!pr.includes('п')){ok=false;why=`${W(B,i)}: вопрос к сказуемому задаём от подлежащего`}else if(!PREDQ.includes(s.q)){ok=false;why=`${W(B,i)}: к сказуемому задаём вопрос «что делает?», «что сделал?»…`}}
  if(ok&&s.role!=='п'&&s.role!=='с'){
   if(s.parent<0){ok=false;why=`${W(B,i)}: проведи к нему стрелку с вопросом`}
   else if(s.parent!==k.parent){ok=false;why=`${W(B,i)}: вопрос задаётся от другого слова`}
   else if(!s.q){ok=false;why=`${W(B,i)}: выбери вопрос над стрелкой`}
   else if(!qMatch(s.q,k.q)){ok=false;why=`${W(B,i)}: неверный вопрос`}
   else if(s.role==='д'&&k.cs&&!alts(k.cs).includes(s.cs)){ok=false;why=s.cs?`${W(B,i)}: неверный падеж`:`${W(B,i)}: выбери падеж (нажми на слово ещё раз инструментом «Дополнение»)`}}
  if(ok&&k.both&&s.role==='д'&&notes.length<2)notes.push(s.role==='д'?`${W(B,i)}: засчитано как дополнение (${s.q}). По вопросу «где? куда?» это обстоятельство места — так тоже верно.`:`${W(B,i)}: обстоятельство места. Можно и как дополнение — по падежному вопросу.`);
  marks[i]=ok?'ok':'bad';ok?good++:(bad++,errs.push(why))});
 const miss=missSet.size;
 B.marks=marks;B.missSet=missSet;B.acc=new Set();B.teacher=false;B.checked=true;refresh(B);
 const win=bad===0&&miss===0&&good>0;
 if(win){setFb(B,'Отлично! Всё верно! ⭐'+(notes.length&&m==='full'?`<div style="font-size:.72em;font-weight:600;color:#475569;font-family:Segoe UI,Arial">${notes.join('<br>')}</div>`:''),'good');beep(true)}
 else{let h=bad?`Ошибок: ${bad}.`:'';if(miss)h+=` Найдено не всё — осталось ещё ${miss}.`;if(!good&&!bad&&!miss)h='Пока ничего не отмечено.';
  if(errs.length)h+=`<br><ul>${errs.slice(0,4).map(e=>`<li>${e}</li>`).join('')}</ul>`;setFb(B,h,'badc');beep(false)}
 return win}

/* ---- исправление учителем ---- */
function addAlt(a,b){if(!b)return a;const L=a?a.split('|'):[];if(L.some(x=>qn(x)===qn(b)))return a;return a?a+'|'+b:b}
function applyTeacher(B){const m=B.opt.mode;
 B.acc.forEach(i=>{const k=B.key[i],s=B.st[i],kr=k.role?k.role.split('|'):[],krn=kr.filter(Boolean);
  if(B.missSet.has(i)){if(!kr.includes(''))k.role=k.role+'|';return}
  if(m==='basis'){k.role=krn.length?addAlt(k.role,s.role):'|'+s.role;return}
  if(m==='colloc'){if(k.parent!==s.parent){k.parent=s.parent;k.q=s.q}else k.q=addAlt(k.q,s.q);return}
  if(!krn.length){k.role='|'+s.role;k.parent=s.parent;k.q=s.q;k.cs=s.cs;return}
  k.role=addAlt(k.role,s.role);
  if(s.role!=='п'&&s.role!=='с'){if(k.parent!==s.parent){k.parent=s.parent;k.q=s.q}else k.q=addAlt(k.q,s.q);if(s.cs)k.cs=addAlt(k.cs,s.cs)}});
 USER.over=USER.over||{};
 if(B.parts)B.parts.forEach(p=>{const ch=B.chips.slice(p.off,p.off+p.len),ky=B.key.slice(p.off,p.off+p.len).map(k=>({...k,parent:k.parent>=0?k.parent-p.off:-1}));USER.over[p.src0]=serialize(ch,ky)});
 else USER.over[B.src0]=serialize(B.chips,B.key);saveUser()}
function teacherMode(B,host,onSolved){
 B.teacher=true;B.acc=new Set();refresh(B);
 if(B.fbEl)B.fbEl.style.visibility='hidden';
 host.innerHTML=`<div class="tpanel"><b>👩‍🏫 Учитель:</b> нажмите на слова, которые ученик сделал <b>правильно</b>.${B.missSet.size?' Оранжевые — можно не отмечать (нажмите).':''}
  <label><input type="checkbox" id="tRem" checked> запомнить как верный</label>
  <div class="actions"><button class="btn" id="tCancel">Отмена</button><button class="btn warn" id="tAll">✓ Засчитать всё</button><button class="btn ok" id="tDone">Готово</button></div></div>`;
 const finish=(all)=>{const rem=$('#tRem',host).checked;host.innerHTML='';if(B.fbEl)B.fbEl.style.visibility='';
  if(all){if(rem&&B.acc.size)applyTeacher(B);B.teacher=false;Object.keys(B.marks).forEach(i=>B.marks[i]='ok');B.missSet=new Set();refresh(B);setFb(B,'Засчитано учителем ✓'+(rem&&B.acc.size?' Исправление сохранено.':''),'good');beep(true);onSolved();return}
  if(rem&&B.acc.size){applyTeacher(B);const win=checkBoard(B);if(win){setFb(B,'Засчитано учителем ✓ Исправление сохранено.','good');onSolved()}else{const h=B.fbEl.innerHTML;setFb(B,'Исправление сохранено. '+h,'badc')}return}
  const leftBad=Object.keys(B.marks).filter(i=>B.marks[i]==='bad'&&!B.acc.has(+i)).length,leftMiss=[...B.missSet].filter(i=>!B.acc.has(i)).length;
  B.acc.forEach(i=>{if(B.marks[i]==='bad')B.marks[i]='ok'});B.teacher=false;B.missSet=new Set([...B.missSet].filter(i=>!B.acc.has(i)));refresh(B);
  if(!leftBad&&!leftMiss){setFb(B,'Засчитано учителем ✓','good');beep(true);onSolved()}
  else setFb(B,`Исправлено учителем. Осталось ошибок: ${leftBad}${leftMiss?`, не найдено: ${leftMiss}`:''}.`,'badc')};
 $('#tCancel',host).onclick=()=>{B.teacher=false;B.acc=new Set();host.innerHTML='';if(B.fbEl)B.fbEl.style.visibility='';refresh(B)};
 $('#tAll',host).onclick=()=>{Object.keys(B.marks).forEach(i=>{if(B.marks[i]==='bad')B.acc.add(+i)});finish(true)};
 $('#tDone',host).onclick=()=>finish(false)}

function penguinSVG(pose){
 const F='#1e293b',R='#6d28d9',T='#facc15';
 const fl=(cx,cy,rot)=>`<g transform="rotate(${rot} ${cx} ${cy})"><ellipse cx="${cx}" cy="${cy}" rx="15" ry="42" fill="${R}"/><ellipse cx="${cx}" cy="${cy+30}" rx="11" ry="16" fill="${F}"/></g>`;
 const L=pose==='happy'?fl(40,118,40):pose==='think'?fl(44,165,10):fl(40,165,14);
 const Rr=pose==='hi'?fl(165,110,-40):pose==='happy'?fl(160,118,-40):pose==='point'?`<line x1="186" y1="146" x2="244" y2="112" stroke="#7c2d12" stroke-width="6" stroke-linecap="round"/><circle cx="244" cy="112" r="6" fill="#ef4444"/>${fl(170,150,-65)}`:pose==='think'?fl(146,78,-150):fl(160,165,-14);
 const look=pose==='think'?[-3,-6]:pose==='point'?[5,0]:[0,2];
 const eye=x=>`<circle cx="${x}" cy="100" r="19" fill="#fff"/><circle cx="${x+look[0]}" cy="${102+look[1]}" r="9" fill="${F}"/><circle cx="${x+look[0]+3}" cy="${98+look[1]}" r="3.2" fill="#fff"/><circle cx="${x}" cy="100" r="23" fill="none" stroke="#111827" stroke-width="5"/>`;
 const extra=pose==='happy'?'<path d="M18 40l5 11 12 1-9 8 3 12-11-6-11 6 3-12-9-8 12-1z" fill="#facc15" stroke="#fff" stroke-width="2"/><path d="M196 34l4 9 10 1-8 7 3 10-9-5-9 5 3-10-8-7 10-1z" fill="#facc15" stroke="#fff" stroke-width="2"/>':pose==='think'?'<text x="186" y="50" font-size="42" font-weight="900" fill="#7c3aed" font-family="Arial">?</text>':'';
 const mouth=pose==='think'?'<path d="M92 128 L108 128 L100 138 Z" fill="#f59e0b"/>':'<path d="M90 124 L110 124 L100 140 Z" fill="#f59e0b"/><path d="M94 145 Q100 150 106 145" stroke="#be123c" stroke-width="3" fill="none"/>';
 const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 250">${extra}
  ${L}${Rr}
  <ellipse cx="100" cy="148" rx="64" ry="88" fill="${F}"/>
  <path d="M100 66c26 0 44 16 44 38 0 14-8 22-14 30 10 18 14 34 14 52 0 32-20 48-44 48s-44-16-44-48c0-18 4-34 14-52-6-8-14-16-14-30 0-22 18-38 44-38z" fill="#fff"/>
  <path d="M38 150 Q46 132 70 128 L78 236 Q50 236 34 226 Z" fill="${R}"/><path d="M162 150 Q154 132 130 128 L122 236 Q150 236 166 226 Z" fill="${R}"/>
  <path d="M70 128 L78 236" stroke="${T}" stroke-width="5"/><path d="M130 128 L122 236" stroke="${T}" stroke-width="5"/>
  <circle cx="64" cy="126" r="8" fill="#fda4af" opacity=".75"/><circle cx="136" cy="126" r="8" fill="#fda4af" opacity=".75"/>
  ${eye(78)}${eye(122)}<path d="M98 99 Q100 95 102 99" stroke="#111827" stroke-width="4" fill="none"/>
  ${mouth}
  <ellipse cx="80" cy="238" rx="17" ry="7" fill="#f59e0b"/><ellipse cx="120" cy="238" rx="17" ry="7" fill="#f59e0b"/>
  <path d="M100 26 L154 44 L100 62 L46 44 Z" fill="#111827"/><path d="M72 50 L72 66 Q100 76 128 66 L128 50 Q100 60 72 50 Z" fill="#111827"/>
  <path d="M100 44 L144 52 L144 80" stroke="${T}" stroke-width="3" fill="none"/><circle cx="144" cy="83" r="5" fill="${T}"/>
 </svg>`;
 return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}
const charSrc=p=>CHAR_IMG[p]||penguinSVG(p);
function setPose(p){const im=document.getElementById('charT');if(im&&im.dataset.p!==p){im.dataset.p=p;im.src=charSrc(p)}}
/* наклейки (SVG) */
const STK={
 star:'<svg viewBox="0 0 60 60"><path d="M30 3l8 17 19 2-14 13 4 19-17-10-17 10 4-19L3 22l19-2z" fill="#facc15" stroke="#fff" stroke-width="4" stroke-linejoin="round"/></svg>',
 pencil:'<svg viewBox="0 0 120 40"><g stroke="#fff" stroke-width="4" stroke-linejoin="round"><path d="M10 8h80v24H10z" fill="#f59e0b"/><path d="M90 8l26 12-26 12z" fill="#fde68a"/><path d="M2 8h12v24H2z" fill="#f472b6"/></g><path d="M108 16l8 4-8 4z" fill="#334155"/></svg>',

 ok:'<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" fill="#22c55e" stroke="#fff" stroke-width="4"/><path d="M18 33l9 9 19-20" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>'};

 app.innerHTML=`<div class="screen">
 <div class="homeGrid">

function menuScreen(title,items,back){

function poolOf(kind){let u=(USER[kind]||[]).map(x=>({src:x.src,id:x.id,user:1})),b=shuffle(BUILT[kind].map(s=>({src:s})));if(S.source==='builtin')u=[];if(S.source==='mine')b=[];return u.concat(b)}
const srcSel=()=>`<div class="srcsel">${[['all','Все'],['builtin','Встроенные'],['mine','Мои']].map(([v,t])=>`<button data-src="${v}" class="${S.source===v?'on':''}">${t}</button>`).join('')}</div>`;

/* cfg: {kind, mode, title, back, items?, header?(idx), keyEdit?{save(idx,src)}} */
function task(cfg){
 const T={cfg,items:cfg.items||poolOf(cfg.kind),idx:0,solved:0};
 const keyMode=!!cfg.keyEdit;
 function draw(){
  const it=T.items[T.idx];
  const extra=(cfg.items?'':srcSel())+`<span class="counter">${T.items.length?T.idx+1:0} / ${T.items.length}</span>`;
  const tools=cfg.mode==='colloc'?[]:cfg.mode==='basis'?['п','с','erase']:['п','с','д','о','об','arrow','erase'];
  app.innerHTML=`<div class="screen task${it&&it.multi?' compact':''}">${topBar(keyMode?'✎ Ключ: '+cfg.title:cfg.title,null,extra)}
   ${cfg.header?`<div class="textview">${cfg.header(T.idx)}</div>`:''}
   <div class="instr">${it&&it.multi&&!keyMode?'Разбери каждое предложение: основа, стрелки с вопросами, члены предложения.':keyMode?'Разметьте правильный ответ — по нему тренажёр будет проверять учеников.':(cfg.mode==='colloc'?INSTR.colloc[cfg.kind]:INSTR[cfg.mode])}</div>
   <div class="boardwrap tape" id="bw"></div>
   ${cfg.mode==='colloc'&&cfg.kind==='sents'?'<div class="colist" id="coL"></div>':''}
   <div class="bottom"><img class="charT" id="charT" src="${charSrc('point')}" data-p="point" alt=""><div class="bcol">
   <div class="tools">${tools.map(t=>`<button class="tool${cfg.mode==='full'?' sm':''}" data-t="${t}">${t==='arrow'?'↷ Стрелка':t==='erase'?'🧽 Ластик':(cfg.mode==='full'?{п:'Подлеж.',с:'Сказ.',д:'Дополн.',о:'Определ.',об:'Обстоят.'}[t]:ROLES[t].name)+' '+lineIcon(t,'2.2em')}</button>`).join('')}</div>
   <div class="fb" id="fb"></div><div id="tp"></div>
   <div class="actions">
    <button class="btn" id="aPrev">⟵</button>
    ${keyMode?'<button class="btn ok" id="aSave">💾 Сохранить ключ</button>':'<button class="btn pri" id="aCheck">✔ Проверить</button><button class="btn warn" id="aShow">👁 Показать ответ</button><button class="btn" id="aTeach" style="display:none;background:#ede9fe">👩‍🏫 Исправить (учитель)</button>'}
    ${cfg.mode==='colloc'&&cfg.kind==='sents'&&!keyMode?'<button class="btn" id="aBasis">Подсказка: основа</button>':''}
    <button class="btn" id="aClear">↺ Очистить</button>
    <button class="btn pri" id="aNext">Дальше ⟶</button></div></div></div></div>`;
  bindBack(cfg.back);
  $$('[data-src]',app).forEach(b=>b.onclick=()=>{S.source=b.dataset.src;T.items=poolOf(cfg.kind);T.idx=0;draw()});
  if(!it){$('#bw').innerHTML=`<div class="instr" style="padding:2rem">Здесь пока пусто. ${S.source==='mine'?'Добавьте свои материалы в разделе «Мои материалы».':''}</div>`;['aPrev','aNext','aCheck','aShow','aClear','aBasis'].forEach(id=>{const e=$('#'+id);if(e)e.disabled=true});return}
  const B=it.multi?makeMultiBoard(it.multi):makeBoard(it.src,cfg.kind);if(it.multi)B.auto=B.auto||false;T.B=B;window.__B=B;B.fbEl=$('#fb');
  if(keyMode&&B.key)B.st=B.key.map(a=>({...a,role:a.role.split('|')[0],q:a.q.split('|')[0]}));
  if(keyMode)B.key=null;
  const size=B.parts?'':B.chips.length>9?'small':'';
  mountBoard($('#bw'),B,{mode:cfg.mode,showX:cfg.mode==='colloc',size});
  {const bw=$('#bw');
   const fit=()=>{if(!B.el.isConnected)return;{const sv=B.el.querySelector('svg');sv.setAttribute('width',0);sv.setAttribute('height',0);$$('.lbl,.xm',B.el).forEach(e=>e.remove())}
    const R=parseFloat(getComputedStyle(document.documentElement).fontSize),fz=+(getComputedStyle(document.documentElement).getPropertyValue('--fz')||1);
    const rows=()=>new Set(B.wEls.map(w=>Math.round(w.getBoundingClientRect().top/5))).size;
    const cs=getComputedStyle(bw),avail=()=>bw.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)-24;
    bw.style.overflowY='hidden';const fits=x=>{B.el.style.fontSize=x+'px';return B.el.scrollHeight<=avail()+1&&(B.parts||rows()<=1)};
    let lo=R*.9,hi=R*8;if(!B.parts&&!fits(R*1.6)){lo=R*.9;hi=R*1.6;const f2=x=>{B.el.style.fontSize=x+'px';return B.el.scrollHeight<=avail()+1};for(let g=0;g<10;g++){const m=(lo+hi)/2;if(f2(m))lo=m;else hi=m}}
    else{for(let g=0;g<11;g++){const m=(lo+hi)/2;if(fits(m))lo=m;else hi=m}}let f=lo;B.el.style.fontSize=f+'px';
    if(fz<.999){f*=fz;B.el.style.fontSize=f+'px'}
    B.capFs=f;drawArcs(B)};
   fit();requestAnimationFrame(()=>requestAnimationFrame(fit));window.__refit=fit;
   if(window.ResizeObserver){new ResizeObserver(()=>drawArcs(B)).observe(bw)}}
  const setTool=t=>{B.tool=t;$$('.tool',app).forEach(b=>b.classList.toggle('on',b.dataset.t===t));B.sel=-1;refresh(B)};
  $$('.tool',app).forEach(b=>b.onclick=()=>setTool(b.dataset.t));
  setTool(cfg.mode==='colloc'?'arrow':'п');
  const coL=$('#coL');
  B.onChange=()=>{if(coL)coL.innerHTML=collList(B);const tb=$('#aTeach');if(tb)tb.style.display='none';const tp=$('#tp');if(tp)tp.innerHTML='';B.teacher=false};B.onChange();
  if(!keyMode){
   if(B.auto&&!it.multi){const ins=$('.instr',app);if(ins)ins.insertAdjacentHTML('beforeend','<div class="hint" style="margin-top:.2rem">🤖 Ответ определён автоматически. Если тренажёр ошибся — нажмите «👩‍🏫 Исправить (учитель)» после проверки.</div>')}
   $('#aCheck').onclick=()=>{if(B.view==='key'){B.view='st';$('#aShow').textContent='👁 Показать ответ'}$('#tp').innerHTML='';const ok=checkBoard(B);if(coL)coL.innerHTML=collList(B);if(ok)solved();$('#aTeach').style.display=ok?'none':''};
   const solved=()=>{if(!B.solved){B.solved=1;T.solved++}};
   $('#aTeach').onclick=()=>{if(B.view==='key'){B.view='st';$('#aShow').textContent='👁 Показать ответ'}if(!B.checked)checkBoard(B);teacherMode(B,$('#tp'),()=>{solved();$('#aTeach').style.display='none';if(coL)coL.innerHTML=collList(B)})};
   $('#aShow').onclick=()=>{B.view=B.view==='key'?'st':'key';B.marks={};B.sel=-1;$('#aShow').textContent=B.view==='key'?'✎ Моя разметка':'👁 Показать ответ';refresh(B);if(coL)coL.innerHTML=collList(B);setFb(B,B.view==='key'?'Это правильный ответ.':'','info')};
   const bb=$('#aBasis');if(bb)bb.onclick=()=>{B.showBasis=!B.showBasis;refresh(B)};
  }else{
   $('#aSave').onclick=()=>{const src=serialize(B.chips,B.st);cfg.keyEdit.save(T.idx,src);T.items[T.idx].src=src;toast('Ключ сохранён ✓');setFb(B,'Ключ сохранён ✓','good')};
  }
  $('#aClear').onclick=()=>{B.st=B.chips.map(blankAnn);B.view='st';if($('#aShow'))$('#aShow').textContent='👁 Показать ответ';setFb(B,'','');changed(B)};
  $('#aPrev').disabled=T.idx===0;$('#aPrev').onclick=()=>{T.idx--;draw()};
  $('#aNext').onclick=()=>{if(T.idx<T.items.length-1){T.idx++;draw()}else finish()};
 }
 function finish(){if(keyMode){cfg.back();return}
  const box=openModal(`<h3>🎉 Задания закончились!</h3><p style="font-size:1.4rem">Решено верно: <b>${T.solved}</b> из ${T.items.length}</p><div class="mact"><button class="btn" id="fB">В меню</button><button class="btn pri" id="fA">Ещё раз</button></div>`);
  $('#fB',box).onclick=()=>{closeModal();cfg.back()};$('#fA',box).onclick=()=>{closeModal();if(!cfg.items)T.items=poolOf(cfg.kind);T.idx=0;T.solved=0;draw()}}
 draw();
}
function depPhrase(B,i,A){const parts=[splitP(B.chips[i].text).core];let j=i-1;while(j>=0&&!B.chips[j].func&&A[j].parent===i){j--}if(j>=0&&B.chips[j].func&&FUNC.has(B.chips[j].word)&&!['и','а','но','или','да'].includes(B.chips[j].word))parts.unshift(B.chips[j].word);return parts.join(' ')}
function collList(B){const A=anns(B);const out=[];A.forEach((a,i)=>{if(a.parent>=0){const cls=B.view==='st'?(B.marks[i]||''):'';out.push(`<span class="${cls}">${esc(splitP(B.chips[a.parent].text).core.toLowerCase())} <b>(${esc(a.q||'?')})</b> ${esc(depPhrase(B,i,A).toLowerCase())}</span>`)}});
 return out.length?'<b style="align-self:center">Словосочетания:</b> '+out.join(''):'<span style="background:none;color:#94a3b8">Найденные словосочетания появятся здесь</span>'}

/* ================= ПЕРЕНОС НА ДОСКУ ================= */
function b64u(bytes){let s='';const b=new Uint8Array(bytes);for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function unb64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const r=atob(s),b=new Uint8Array(r.length);for(let i=0;i<r.length;i++)b[i]=r.charCodeAt(i);return b}
async function pack(o){const bytes=new TextEncoder().encode(JSON.stringify(o));if(window.CompressionStream){try{const st=new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'));return'z'+b64u(await new Response(st).arrayBuffer())}catch(e){}}return'u'+b64u(bytes)}
async function unpack(s){const t=s[0],b=unb64u(s.slice(1));if(t==='z'){const st=new Blob([b]).stream().pipeThrough(new DecompressionStream('deflate-raw'));return JSON.parse(await new Response(st).text())}return JSON.parse(new TextDecoder().decode(b))}
function baseUrl(){return/^https?:/.test(location.protocol)?location.origin+location.pathname:PUBLIC_URL}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
function countUser(d){return(d.colls||[]).length+(d.sents||[]).length+(d.texts||[]).length+Object.keys(d.over||{}).length}

 <div class="step"><span class="n">1</span><div><b>Ссылка (проще всего).</b> Скопируйте ссылку и отправьте её себе (Telegram, WhatsApp, почта). Откройте её на доске — материалы сохранятся на доске сами.

 <div class="step"><span class="n">3</span><div><b>Файл с данными.</b> Сохранить материалы в файл и загрузить его на другом устройстве.

 </div></div>`;
